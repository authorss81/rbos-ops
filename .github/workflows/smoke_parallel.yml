name: Parallel Multi-Worker Smoke Suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'ops-core/**'
      - '.github/workflows/smoke_parallel.yml'

jobs:
  parallel_smoke:
    name: Parallel Worker Matrix Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_id: [1, 2, 3]
      fail-fast: false

    steps:
      - name: Checkout Ops Repository
        uses: actions/checkout@v4

      - name: Verify Key Ring Partitioning
        env:
          K1: ${{ secrets.OPENCODE_KEY_1 }}
          K2: ${{ secrets.OPENCODE_KEY_2 }}
          K3: ${{ secrets.OPENCODE_KEY_3 }}
        run: |
          echo "=== Testing Parallel Worker ${{ matrix.worker_id }} ==="
          if [ "${{ matrix.worker_id }}" -eq 1 ] && [ -n "$K1" ]; then
            echo "[PASS] Dedicated OPENCODE_KEY_1 bound to Worker 1."
          elif [ "${{ matrix.worker_id }}" -eq 2 ] && [ -n "$K2" ]; then
            echo "[PASS] Dedicated OPENCODE_KEY_2 bound to Worker 2."
          elif [ "${{ matrix.worker_id }}" -eq 3 ] && [ -n "$K3" ]; then
            echo "[PASS] Dedicated OPENCODE_KEY_3 bound to Worker 3."
          else
            echo "[INFO] Worker ${{ matrix.worker_id }} operating on shared fallback token ring."
          fi

      - name: Test Atomic CAS Lease Simulation
        run: |
          WORKER_NAME="worker-${{ matrix.worker_id }}"
          TEST_LEASE="/tmp/test_lease_${WORKER_NAME}.json"
          
          echo "Worker ${{ matrix.worker_id }} acquiring isolated test lease..."
          cat <<EOF > "$TEST_LEASE"
          {
            "worker_id": "$WORKER_NAME",
            "epoch": $(date +%s),
            "status": "active"
          }
          EOF
          
          # Verify lease content
          ACQUIRED_ID=$(jq -r '.worker_id' "$TEST_LEASE")
          if [ "$ACQUIRED_ID" != "$WORKER_NAME" ]; then
            echo "[FAIL] Lease acquisition identity mismatch!"
            exit 1
          fi
          echo "[PASS] Worker ${{ matrix.worker_id }} secured lease atomically."

      - name: Exercise Single-Target Delta Gate Verification
        run: |
          chmod +x ops-core/verify.sh ops-core/dispatch.sh
          # Test runner dispatch select
          NEXT=$(ops-core/dispatch.sh select || true)
          echo "[PASS] Dispatch select responded cleanly: $NEXT"

      - name: Cleanup Simulated Lease
        run: |
          rm -f "/tmp/test_lease_worker-${{ matrix.worker_id }}.json"
          echo "[PASS] Worker ${{ matrix.worker_id }} completed parallel smoke test cleanly."
